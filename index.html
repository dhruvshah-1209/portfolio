<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhruv Shah — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=Special+Elite&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EFE6D3;
    --paper-card: #FBF5E7;
    --paper-card2: #F4EBD6;
    --ink: #2C2013;
    --ink-soft: #5A4C39;
    --brown: #6B4A31;
    --brown-dark: #40281A;
    --tan: #C9A876;
    --rust: #A85C36;
    --line: rgba(44,32,19,0.18);
    --wood: #6E4A2E;
    --wood-dark: #4E3220;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  body{
    background:
      repeating-linear-gradient(100deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(100deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 26px),
      linear-gradient(160deg, var(--wood), var(--wood-dark));
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  a{ color:inherit; }
  .serif{ font-family:'Fraunces', serif; }
  .type{ font-family:'Special Elite', monospace; }

  /* ambient spotlight that follows the cursor */
  .spotlight{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(circle 260px at var(--mx,50%) var(--my,50%), rgba(255,240,210,0.09), transparent 70%);
  }

  .scene-head{ text-align:center; padding:52px 24px 8px; position:relative; z-index:2; }
  .scene-head h1{ font-size:clamp(30px,5vw,48px); color:#F6EEDD; font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,0.3); }
  .scene-head p{ font-family:'Special Elite', monospace; font-size:13px; color:#D9C7A6; margin-top:8px; }

  .desk{
    position:relative; z-index:2;
    max-width:1100px; margin:40px auto 100px;
    display:flex; flex-wrap:wrap; gap:56px 64px;
    justify-content:center; align-items:flex-start;
    padding:20px;
  }

  .desk-obj, .trinket{ touch-action:none; cursor:grab; user-select:none; }
  .desk-obj:active, .trinket:active{ cursor:grabbing; }

  /* --- object: notebook (About) --- */
  .obj-notebook{
    width:150px; height:190px;
    background:linear-gradient(160deg, #7A4E2E, #5A371F);
    border-radius:4px 8px 8px 4px;
    box-shadow:0 14px 26px rgba(0,0,0,0.4), inset -6px 0 10px rgba(0,0,0,0.25);
    position:relative;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease;
  }
  .obj-notebook::before{ content:""; position:absolute; left:14px; top:0; bottom:0; width:2px; background:rgba(0,0,0,0.3); }
  .obj-notebook .ribbon{ position:absolute; top:-4px; right:22px; width:10px; height:34px; background:var(--rust); }
  .obj-notebook .lbl{ color:#F1E3C8; font-family:'Special Elite', monospace; font-size:12px; text-align:center; padding:0 18px; }

  /* --- object: corkboard mini (Work) --- */
  .obj-cork{
    width:170px; height:190px;
    background:#DFC9A0;
    background-image:radial-gradient(circle at 1px 1px, rgba(44,32,19,0.15) 1px, transparent 0);
    background-size:12px 12px;
    border:6px solid #7A4E2E;
    border-radius:3px;
    box-shadow:0 14px 26px rgba(0,0,0,0.4);
    position:relative;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px;
  }
  .obj-cork .mini-card{ position:absolute; width:52px; height:64px; background:var(--paper-card); border:1px solid var(--line); box-shadow:0 4px 6px rgba(0,0,0,0.25); }
  .obj-cork .mc1{ top:18px; left:16px; transform:rotate(-6deg); }
  .obj-cork .mc2{ top:24px; right:14px; transform:rotate(5deg); }
  .obj-cork .mc3{ bottom:38px; left:44px; transform:rotate(-2deg); }
  .obj-cork .lbl{ color:var(--brown-dark); font-family:'Special Elite', monospace; font-size:12px; }

  /* --- object: rolodex box (Experience) --- */
  .obj-rolo{
    width:170px; height:130px; margin-top:32px;
    background:linear-gradient(160deg,#8A5C36,#5A371F);
    border-radius:6px;
    box-shadow:0 14px 26px rgba(0,0,0,0.4);
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .obj-rolo .card-peek{ position:absolute; top:-24px; left:50%; transform:translateX(-50%); width:70px; height:40px; background:var(--paper-card); border:1px solid var(--line); border-radius:2px 2px 0 0; box-shadow:0 -4px 8px rgba(0,0,0,0.2); }
  .obj-rolo .lbl{ color:#F1E3C8; font-family:'Special Elite', monospace; font-size:12px; margin-top:20px; }

  /* --- object: sticker sheet (Skills) --- */
  .obj-stickers{
    width:150px; height:170px;
    background:var(--paper-card2);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:0 14px 26px rgba(0,0,0,0.35);
    position:relative;
    padding:14px;
  }
  .obj-stickers .dot{ position:absolute; width:26px; height:26px; border-radius:50%; box-shadow:0 3px 5px rgba(0,0,0,0.2); }
  .obj-stickers .lbl{ position:absolute; bottom:12px; left:14px; font-family:'Special Elite', monospace; font-size:12px; color:var(--brown-dark); }

  /* --- object: postcard (Contact) --- */
  .obj-postcard{
    width:190px; height:130px; margin-top:30px;
    background:var(--paper-card);
    border:1px solid var(--line);
    box-shadow:0 14px 26px rgba(0,0,0,0.35);
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  .obj-postcard::after{ content:""; position:absolute; top:8px; right:8px; width:26px; height:32px; border:1.5px dashed var(--rust); }
  .obj-postcard .lbl{ font-family:'Special Elite', monospace; font-size:12px; color:var(--brown-dark); }

  .desk-obj:hover{ transform:translateY(-6px) rotate(-1deg); }

  /* --- trinkets --- */
  .trinket{ font-size:34px; filter:drop-shadow(0 8px 10px rgba(0,0,0,0.4)); transition:transform .3s ease; position:relative; align-self:center; }
  .trinket.film:hover{ transform:rotate(35deg); }
  .trinket.paddle:hover{ transform:translateY(-8px) rotate(-10deg); }
  .trinket.shades:hover{ transform:translateY(-4px) scale(1.08); }
  .fact-bubble{
    position:absolute; bottom:110%; left:50%; transform:translateX(-50%) scale(0.9);
    background:var(--paper-card); color:var(--ink); border:1px solid var(--line);
    font-family:'Special Elite', monospace; font-size:11.5px;
    padding:8px 12px; border-radius:5px; white-space:nowrap;
    box-shadow:0 6px 14px rgba(0,0,0,0.3);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .trinket.show .fact-bubble{ opacity:1; transform:translateX(-50%) scale(1); }

  /* ---------- OVERLAY ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(20,14,8,0.55);
    display:none; align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(3px);
  }
  .overlay.open{ display:flex; animation:fadeBg .25s ease; }
  @keyframes fadeBg{ from{opacity:0;} to{opacity:1;} }
  .overlay-card{
    background:var(--paper);
    border-radius:8px;
    max-width:680px; width:100%; max-height:86vh; overflow:auto;
    padding:32px 30px 36px;
    position:relative;
    box-shadow:0 30px 60px rgba(0,0,0,0.5);
    animation:pop .3s cubic-bezier(.3,.6,.3,1);
  }
  @keyframes pop{ from{ opacity:0; transform:scale(0.92) translateY(14px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .close-btn{
    position:absolute; top:14px; right:16px;
    background:var(--brown-dark); color:var(--paper-card);
    border:none; width:30px; height:30px; border-radius:50%;
    font-size:16px; cursor:pointer; line-height:1;
  }
  .close-btn:hover{ background:var(--rust); }

  .eyebrow{ font-family:'Special Elite', monospace; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--rust); margin-bottom:8px; }
  h2.head{ font-size:clamp(22px,4vw,28px); font-weight:700; margin-bottom:20px; }

  .about-grid{ display:grid; grid-template-columns:1.2fr 0.8fr; gap:22px; }
  @media (max-width:560px){ .about-grid{ grid-template-columns:1fr; } }
  .paper-card{ background:var(--paper-card); border:1px solid var(--line); border-radius:5px; padding:20px 22px; }
  .about-grid p{ font-size:14.5px; line-height:1.7; color:var(--ink-soft); margin-bottom:12px; }
  .about-grid strong{ color:var(--ink); }
  .stamp-list .row{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
  .stamp-list .row:last-child{ border-bottom:none; }
  .stamp-list .k{ font-family:'Special Elite', monospace; color:var(--ink-soft); font-size:11.5px; }
  .polaroids{ display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; }
  .polaroid{ background:var(--paper-card); border:1px solid var(--line); padding:8px 8px 20px; width:96px; text-align:center; font-family:'Special Elite', monospace; font-size:11px; box-shadow:0 4px 10px rgba(44,32,19,0.15); }
  .polaroid .box{ height:60px; border-radius:2px; margin-bottom:8px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .polaroid:nth-child(1){ transform:rotate(-4deg); }
  .polaroid:nth-child(2){ transform:rotate(3deg); }
  .polaroid:nth-child(3){ transform:rotate(-2deg); }

  .hint{ font-family:'Special Elite', monospace; font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
  .corkboard{ background:#DFC9A0; background-image:radial-gradient(circle at 1px 1px, rgba(44,32,19,0.08) 1px, transparent 0); background-size:16px 16px; border:1px solid var(--line); border-radius:6px; padding:24px; display:flex; flex-wrap:wrap; gap:22px; justify-content:center; }
  .flip-outer{ perspective:1200px; width:190px; height:230px; touch-action:none; cursor:grab; }
  .flip-outer:active{ cursor:grabbing; }
  .flip-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1); }
  .flip-outer.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:4px; border:1px solid var(--line); padding:16px; box-shadow:0 10px 18px rgba(44,32,19,0.18); display:flex; flex-direction:column; }
  .face.front{ background:var(--paper-card); }
  .face.back{ background:var(--brown-dark); color:#EFE6D3; transform:rotateY(180deg); }
  .pin-sm{ position:absolute; top:-7px; left:50%; transform:translateX(-50%); width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #d98a5e, var(--rust)); box-shadow:0 2px 3px rgba(0,0,0,0.3); }
  .face .tag-code{ font-family:'Special Elite', monospace; font-size:10.5px; color:var(--rust); margin-bottom:8px; }
  .face.back .tag-code{ color:var(--tan); }
  .face h3{ font-family:'Fraunces', serif; font-size:17px; margin-bottom:5px; }
  .face .role{ font-size:11px; color:var(--ink-soft); font-style:italic; margin-bottom:auto; }
  .face.back .role{ color:#D9CBB2; }
  .face .flip-note{ font-family:'Special Elite', monospace; font-size:10px; color:var(--ink-soft); margin-top:8px; }
  .face.back p{ font-size:12px; line-height:1.5; margin-bottom:10px; color:#EFE6D3; }
  .chips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:auto; }
  .chip{ font-family:'Special Elite', monospace; font-size:9.5px; padding:3px 7px; border:1px solid rgba(239,230,211,0.35); border-radius:3px; color:#EFE6D3; }

  .rolodex{ display:flex; flex-direction:column; align-items:center; }
  .card-stack{ position:relative; width:100%; max-width:400px; height:150px; }
  .idx-card{ position:absolute; inset:0; background:var(--paper-card); border:1px solid var(--line); border-radius:5px; padding:20px 22px; box-shadow:0 8px 16px rgba(44,32,19,0.14); }
  .idx-card .role{ font-family:'Fraunces', serif; font-size:17px; font-weight:600; }
  .idx-card .org{ color:var(--ink-soft); font-size:13px; margin-top:4px; }
  .idx-card .date{ font-family:'Special Elite', monospace; font-size:11px; color:var(--rust); margin-top:12px; }
  .rolodex-controls{ display:flex; align-items:center; gap:16px; margin-top:18px; }
  .rd-btn{ font-family:'Special Elite', monospace; font-size:12px; background:var(--brown); color:var(--paper-card); border:none; padding:9px 14px; border-radius:5px; cursor:pointer; }
  .rd-btn:hover{ background:var(--brown-dark); }
  .rd-count{ font-family:'Special Elite', monospace; font-size:11px; color:var(--ink-soft); }

  .pinboard{ display:flex; flex-wrap:wrap; gap:10px; }
  .sticker{ font-size:13px; font-weight:500; background:var(--paper-card2); border:1px solid var(--line); padding:8px 13px; border-radius:3px; box-shadow:0 4px 8px rgba(44,32,19,0.1); }
  .sticker:nth-child(4n){ transform:rotate(-3deg); }
  .sticker:nth-child(4n+1){ transform:rotate(2deg); }
  .sticker:nth-child(4n+2){ transform:rotate(-1.5deg); }

  .pc-outer{ perspective:1400px; width:100%; max-width:400px; height:230px; cursor:pointer; margin:0 auto; }
  .pc-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.4,.2,.2,1); }
  .pc-outer.flipped .pc-inner{ transform:rotateY(180deg); }
  .pc-face{ position:absolute; inset:0; backface-visibility:hidden; border:1px solid var(--line); border-radius:6px; box-shadow:0 12px 22px rgba(44,32,19,0.2); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; padding:20px; }
  .pc-face.f1{ background:var(--paper-card); }
  .pc-face.f2{ background:var(--brown-dark); color:#EFE6D3; transform:rotateY(180deg); }
  .pc-face.f1 h2{ font-family:'Fraunces', serif; font-size:24px; }
  .pc-face.f1 .type{ font-size:11.5px; color:var(--ink-soft); }
  .pc-links{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .pc-links a{ font-family:'Special Elite', monospace; font-size:12px; border:1px solid rgba(239,230,211,0.4); padding:8px 14px; border-radius:4px; }
  .pc-links a:hover{ background:rgba(239,230,211,0.12); }

  footer{ position:relative; z-index:2; text-align:center; padding:0 0 50px; font-family:'Special Elite', monospace; font-size:11.5px; color:#D9C7A6; }

  /* ---------- SCENE SWITCHING ---------- */
  .scene{ display:none; }
  .scene.active{ display:block; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sm-red:#E62429; --sm-red-dark:#9C1216; --sm-blue:#0B3D91; --sm-blue-dark:#061F4D;
    --sm-black:#0A0A0C; --sm-ink:#101014; --sm-white:#F5F3EC;
  }
  .bangers{ font-family:'Bangers', cursive; letter-spacing:0.02em; }
  .oswald{ font-family:'Oswald', sans-serif; }

  #scene-web{
    background:
      radial-gradient(circle at 15% 10%, rgba(230,36,41,0.16), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(11,61,145,0.22), transparent 50%),
      radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1.4px) 0 0/14px 14px,
      var(--sm-black);
    min-height:100vh; position:relative; overflow:hidden; color:var(--sm-white);
    font-family:'Oswald', sans-serif;
  }
  #scene-web .sm-head{ text-align:center; padding:70px 24px 10px; position:relative; z-index:2; }
  #scene-web .sm-head h1{ font-size:clamp(40px,8vw,74px); color:var(--sm-white); text-shadow:0 0 0 var(--sm-black), 4px 4px 0 var(--sm-red), 8px 8px 0 rgba(0,0,0,0.5); }
  #scene-web .sm-head p{ font-size:14px; color:#C9C4B8; margin-top:10px; letter-spacing:0.04em; text-transform:uppercase; }

  .sm-logo{
    position:fixed; top:24px; left:24px; z-index:150;
    font-size:34px; filter:drop-shadow(0 0 8px rgba(230,36,41,0.6));
    cursor:default;
  }

  .sm-swing{ position:absolute; top:60px; left:-60px; font-size:26px; z-index:1; animation:swingAcross 14s linear infinite; opacity:0.85; }
  @keyframes swingAcross{
    0%{ left:-60px; top:40px; transform:rotate(-15deg); }
    45%{ top:140px; transform:rotate(10deg); }
    50%{ left:52%; top:170px; }
    100%{ left:110%; top:60px; transform:rotate(-15deg); }
  }

  .sm-spiderface{
    position:absolute; top:50%; left:50%; z-index:0;
    width:min(80vw, 640px); height:auto;
    transform:translate(-50%,-50%);
    opacity:0.07;
    pointer-events:none;
  }

  .sm-panels{
    position:relative; z-index:2;
    max-width:1040px; margin:30px auto 100px;
    display:grid; grid-template-columns:repeat(3, 1fr); gap:26px;
    padding:20px 24px;
  }
  @media (max-width:760px){ .sm-panels{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .sm-panels{ grid-template-columns:1fr; } }

  .sm-panel{
    position:relative;
    border:4px solid var(--sm-black);
    outline:2px solid rgba(255,255,255,0.85);
    outline-offset:-8px;
    border-radius:6px;
    min-height:150px;
    padding:20px;
    display:flex; flex-direction:column; justify-content:flex-end; gap:6px;
    cursor:pointer;
    transition:transform .15s ease;
    box-shadow:6px 6px 0 rgba(0,0,0,0.55);
    background-image:radial-gradient(rgba(255,255,255,0.16) 1px, transparent 1.3px);
    background-size:10px 10px;
  }
  .sm-panel:nth-child(1){ transform:rotate(-1.2deg); }
  .sm-panel:nth-child(2){ transform:rotate(0.8deg); }
  .sm-panel:nth-child(3){ transform:rotate(-0.6deg); }
  .sm-panel:nth-child(4){ transform:rotate(1deg); }
  .sm-panel:nth-child(5){ transform:rotate(-0.9deg); }
  .sm-panel:hover{ transform:scale(1.04) rotate(0deg) !important; }
  .sm-panel.red{ background-color:var(--sm-red-dark); }
  .sm-panel.blue{ background-color:var(--sm-blue-dark); }
  .sm-panel .icon{ font-size:30px; }
  .sm-panel h3{ font-family:'Bangers', cursive; font-size:26px; letter-spacing:0.02em; color:var(--sm-white); }
  .sm-panel span.sub{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(245,243,236,0.7); }

  .sm-webline{ position:fixed; inset:0; pointer-events:none; z-index:300; }
  .sm-burst{ position:fixed; z-index:300; pointer-events:none; width:70px; height:70px; margin:-35px 0 0 -35px; opacity:0; }
  .sm-burst.show{ animation:burstPop .45s ease forwards; }
  @keyframes burstPop{ 0%{ opacity:0; transform:scale(0.2) rotate(0deg); } 40%{ opacity:1; transform:scale(1.1) rotate(10deg); } 100%{ opacity:0; transform:scale(1.3) rotate(15deg); } }
  .sm-thwip{
    position:fixed; z-index:301; pointer-events:none;
    font-family:'Bangers', cursive; font-size:30px; color:#FFE23D;
    text-shadow:-2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    opacity:0;
  }
  .sm-thwip.show{ animation:thwipPop .55s ease forwards; }
  @keyframes thwipPop{ 0%{ opacity:0; transform:scale(0.5) rotate(-8deg); } 30%{ opacity:1; transform:scale(1.15) rotate(4deg); } 100%{ opacity:0; transform:scale(1) translateY(-24px) rotate(0deg); } }

  /* ---------- WEB OVERLAY ---------- */
  .sm-overlay{
    position:fixed; inset:0; z-index:250;
    background:rgba(4,4,6,0.72);
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .sm-overlay.open{ display:flex; animation:fadeBg .2s ease; }
  .sm-card{
    background:var(--sm-white); color:var(--sm-ink);
    border:5px solid var(--sm-black);
    border-radius:6px;
    max-width:640px; width:100%; max-height:86vh; overflow:auto;
    padding:30px 28px 34px; position:relative;
    box-shadow:10px 10px 0 rgba(0,0,0,0.6);
    animation:pop .25s cubic-bezier(.3,.6,.3,1);
  }
  .sm-close{
    position:absolute; top:12px; right:14px;
    background:var(--sm-red); color:#fff; border:3px solid var(--sm-black);
    width:34px; height:34px; border-radius:50%; font-size:18px; cursor:pointer; line-height:1;
  }
  .sm-eyebrow{ font-family:'Bangers', cursive; font-size:16px; color:var(--sm-red); letter-spacing:0.04em; }
  .sm-card h2.sm-title{ font-family:'Bangers', cursive; font-size:34px; margin-bottom:16px; }
  .sm-card p{ font-size:14.5px; line-height:1.7; color:#2A2A2E; margin-bottom:12px; }

<script>
  // synthesized comic-hit sound effects (generated in-browser, no external audio needed)
  let audioCtx;
  function getCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }
  function noiseBuffer(ctx, dur){
    const size = Math.max(1, Math.floor(ctx.sampleRate*dur));
    const buf = ctx.createBuffer(1, size, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<size;i++) d[i] = Math.random()*2-1;
    return buf;
  }
  function playThump(freqStart, freqEnd, dur, noiseMix){
    const ctx=getCtx(); const now=ctx.currentTime;
    const osc=ctx.createOscillator(); osc.type='triangle';
    osc.frequency.setValueAtTime(freqStart, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,30), now+dur);
    const og=ctx.createGain();
    og.gain.setValueAtTime(0.5, now);
    og.gain.exponentialRampToValueAtTime(0.001, now+dur);
    osc.connect(og); og.connect(ctx.destination);
    osc.start(now); osc.stop(now+dur);
    if(noiseMix>0){
      const src=ctx.createBufferSource(); src.buffer=noiseBuffer(ctx,dur);
      const filt=ctx.createBiquadFilter(); filt.type='bandpass';
      filt.frequency.setValueAtTime(freqStart*1.4, now);
      filt.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,80), now+dur);
      const ng=ctx.createGain();
      ng.gain.setValueAtTime(noiseMix, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now+dur);
      src.connect(filt); filt.connect(ng); ng.connect(ctx.destination);
      src.start(now); src.stop(now+dur);
    }
  }
  function playWhoosh(freqStart, freqEnd, dur){
    const ctx=getCtx(); const now=ctx.currentTime;
    const src=ctx.createBufferSource(); src.buffer=noiseBuffer(ctx,dur);
    const filt=ctx.createBiquadFilter(); filt.type='bandpass'; filt.Q.value=0.7;
    filt.frequency.setValueAtTime(freqStart, now);
    filt.frequency.exponentialRampToValueAtTime(freqEnd, now+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.35, now+dur*0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start(now); src.stop(now+dur);
  }
  function playSfx(word){
    try{
      switch(word){
        case 'THWIP!': playThump(900,220,0.09,0.3); break;
        case 'THWACK!': playThump(500,120,0.13,0.5); break;
        case 'THWOCK!': playThump(300,90,0.16,0.45); break;
        case 'WHISH!': playWhoosh(3000,600,0.22); break;
        case 'WHOOSH!': playWhoosh(2200,300,0.4); break;
      }
    }catch(e){ console.warn('SFX unavailable', e); }
  }

  // web-shoot effect: draws a line from the spider logo to the clicked panel, then opens it
  const smLogo = document.querySelector('.sm-logo');
  const smOverlay = document.getElementById('smOverlay');
  const smOverlayContent = document.getElementById('smOverlayContent');

  function shootWeb(targetEl, onDone){
    const from = smLogo.getBoundingClientRect();
    const to = targetEl.getBoundingClientRect();
    const fx = from.left + from.width/2, fy = from.top + from.height/2;
    const tx = to.left + to.width/2, ty = to.top + to.height/2;
    const dist = Math.hypot(tx-fx, ty-fy);

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('class','sm-webline');
    svg.setAttribute('width', window.innerWidth); svg.setAttribute('height', window.innerHeight);
    const line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1',fx); line.setAttribute('y1',fy);
    line.setAttribute('x2',tx); line.setAttribute('y2',ty);
    line.setAttribute('stroke','#F5F3EC'); line.setAttribute('stroke-width','2.5');
    line.setAttribute('stroke-dasharray', dist); line.setAttribute('stroke-dashoffset', dist);
    line.style.transition='stroke-dashoffset .22s linear';
    svg.appendChild(line);
    document.body.appendChild(svg);
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ line.style.strokeDashoffset='0'; }));

    const thwip = document.createElement('div');
    thwip.className='sm-thwip';
    const SFX = ['THWIP!','THWACK!','THWOCK!','WHISH!','WHOOSH!'];
    const word = SFX[Math.floor(Math.random()*SFX.length)];
    thwip.textContent = word;
    playSfx(word);
    thwip.style.left=(fx+ (tx-fx)*0.35)+'px';
    thwip.style.top=(fy+ (ty-fy)*0.35 - 20)+'px';
    document.body.appendChild(thwip);
    requestAnimationFrame(()=> thwip.classList.add('show'));

    setTimeout(()=>{
      const burst = document.createElement('div');
      burst.className='sm-burst';
      burst.style.left=tx+'px'; burst.style.top=ty+'px';
      burst.innerHTML = `<svg viewBox="0 0 70 70" width="70" height="70">
        <g stroke="#F5F3EC" stroke-width="2" opacity="0.9">
          ${[0,45,90,135,180,225,270,315].map(a=>`<line x1="35" y1="35" x2="${35+30*Math.cos(a*Math.PI/180)}" y2="${35+30*Math.sin(a*Math.PI/180)}"/>`).join('')}
          <circle cx="35" cy="35" r="10" fill="none"/>
        </g></svg>`;
      document.body.appendChild(burst);
      requestAnimationFrame(()=> burst.classList.add('show'));
      setTimeout(()=>{ svg.remove(); thwip.remove(); burst.remove(); if(onDone) onDone(); }, 420);
    }, 220);
  }

  document.querySelectorAll('.sm-panel').forEach(panel=>{
    panel.addEventListener('click', ()=>{
      shootWeb(panel, ()=> openSmOverlay(panel.dataset.open));
    });
  });

  function openSmOverlay(key){
    const tpl = document.getElementById('sm-tpl-'+key);
    smOverlayContent.innerHTML='';
    smOverlayContent.appendChild(tpl.content.cloneNode(true));
    smOverlay.classList.add('open');
  }
  function closeSmOverlay(){ smOverlay.classList.remove('open'); }
  document.getElementById('smClose').addEventListener('click', closeSmOverlay);
  smOverlay.addEventListener('click', e=>{ if(e.target===smOverlay) closeSmOverlay(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSmOverlay(); });
</script>
